services:
  - type: web
    name: pitsapp-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /status
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: LC_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LC_MODEL
        sync: false
      - key: LC_TEMPERATURE
        sync: false
      - key: LC_MAX_TOKENS
        sync: false
