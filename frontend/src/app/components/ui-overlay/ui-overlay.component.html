<div class="toast-stack" *ngIf="toasts.length > 0">
  <div *ngFor="let toast of toasts" [class]="getToastClass(toast)">
    <div class="toast-message">{{ toast.message }}</div>
    <button type="button" class="toast-close" (click)="dismissToast(toast.id)" aria-label="Cerrar">×</button>
  </div>
</div>

<div class="modal-backdrop" *ngIf="confirm" (click)="cancelConfirm()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">{{ confirm.title }}</div>
      <button type="button" class="modal-close" (click)="cancelConfirm()" aria-label="Cerrar">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-message">{{ confirm.message }}</div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" (click)="cancelConfirm()">
        {{ confirm.cancelText || 'Cancelar' }}
      </button>
      <button type="button" [class]="getConfirmButtonClass()" (click)="acceptConfirm()">
        {{ confirm.confirmText || 'Confirmar' }}
      </button>
    </div>
  </div>
</div>
