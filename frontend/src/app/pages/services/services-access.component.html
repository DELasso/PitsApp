<div class="services-access-container">
  <div class="container">
    <div class="card">
      <div class="card-header">
        <h1>Inicia sesión para usar Servicios</h1>
        <p>Para crear solicitudes, ver ofertas y gestionar tu actividad, necesitas estar logeado.</p>
      </div>

      <div class="card-body">
        <ul class="benefits">
          <li>Crear solicitudes de servicio y recibir ofertas</li>
          <li>Ver tus solicitudes y el estado de cada una</li>
          <li>Como proveedor, ver solicitudes disponibles y ofertar</li>
        </ul>

        <div class="actions">
          <button type="button" class="btn btn-primary" (click)="goToLogin()">
            Iniciar sesión
          </button>
          <button type="button" class="btn btn-secondary" (click)="goHome()">
            Volver al inicio
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
